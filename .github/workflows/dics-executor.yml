name: DICS Executor

on:
  push:
    branches: [main]
    paths: [.github/workflows/dics-executor.yml]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      action:
        description: DICS action
        required: true
        default: qa
        type: choice
        options: [baseline, qa, vinext]

permissions:
  contents: write
  issues: write
  pull-requests: read
  actions: read

concurrency:
  group: dics-taco-loco
  cancel-in-progress: false

env:
  SOURCE_REPO: sjo1848/taco-loco-foodtrack
  SOURCE_SHA: a9a9e2c1c70d2a654f7d6b181bf2b18778b49f48
  TARGET_BRANCH: migration/cloudflare-native
  VINEXT_VERSION: 1.0.0-beta.9

jobs:
  execute:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       github.event.issue.title == 'DICS Control Plane' &&
       startsWith(github.event.comment.body, '/dics '))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taco_loco
          POSTGRES_USER: taco_loco
          POSTGRES_PASSWORD: taco_loco_ci
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U taco_loco -d taco_loco"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://taco_loco:taco_loco_ci@localhost:5433/taco_loco?schema=public
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: change-me-in-development
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Resolve and authorize DICS action
        id: command
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == push ]]; then
            action=baseline
          elif [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            action="${{ inputs.action }}"
          else
            association="$(jq -r '.comment.author_association' "$GITHUB_EVENT_PATH")"
            case "$association" in OWNER|MEMBER|COLLABORATOR) ;; *) exit 3 ;; esac
            body="$(jq -r '.comment.body' "$GITHUB_EVENT_PATH")"
            action="$(printf '%s\n' "$body" | head -n1 | sed -E 's#^/dics[[:space:]]+([^[:space:]]+).*#\1#')"
          fi
          case "$action" in baseline|qa|vinext|patch64) ;; *) echo "Unsupported action: $action"; exit 2 ;; esac
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Ensure DICS control-plane issue
        if: github.event_name == 'push'
        shell: bash
        run: |
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'DICS Control Plane in:title' --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title 'DICS Control Plane' --body 'Actions-only mutation channel for Taco Loco migration.'
          fi

      - name: Checkout migration target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          path: target
          fetch-depth: 0

      - name: Checkout frozen source
        if: steps.command.outputs.action == 'baseline'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false

      - name: Restore exact application baseline
        if: steps.command.outputs.action == 'baseline'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target/src target/prisma target/public
          cp -a source/src target/src
          cp -a source/prisma target/prisma
          cp -a source/public target/public
          for f in .env.example eslint.config.mjs middleware.ts next-env.d.ts next.config.ts package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.json vitest.config.mts; do cp "source/$f" "target/$f"; done
          node - <<'NODE'
          const fs=require('fs'); const p='target/package.json'; const j=JSON.parse(fs.readFileSync(p)); j.name='taco-loco'; fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE
          mkdir -p target/docs/contracts target/docs/evidence
          cat > target/INVARIANTS.md <<EOF
          # Taco Loco migration invariants
          1. \`$SOURCE_REPO@$SOURCE_SHA\` is read-only.
          2. Product behavior is preserved during infrastructure migration.
          3. PostgreSQL remains the initial transactional source of truth.
          4. D1 is out of scope for the initial migration.
          5. Server-side validation, idempotency, sessions and persisted OrderEvent replay semantics must survive.
          6. No PASS without exact SHA plus executable evidence.
          7. Functional QA and security audit are independent gates; either may block integration/cutover.
          8. Implementation, Independent Critic and Integration Review are separate gates.
          9. Production cutover requires a Human Gate.
          EOF
          sed -i 's/^          //' target/INVARIANTS.md
          cat > target/STATE.md <<EOF
          # Taco Loco — DICS State
          Contract: TL-CF-MIG-01
          Status: ACTIVE
          Source baseline: \`$SOURCE_REPO@$SOURCE_SHA\`
          Destination branch: \`$TARGET_BRANCH\`
          Current stage: BASELINE_PARITY
          Technical path: FUNCTIONAL_QA -> SECURITY_AUDIT -> VINEXT_CHECK -> VINEXT_BUILD -> ENGINEERING_QA -> INDEPENDENT_CRITIC -> INTEGRATION_REVIEW
          Production cutover: HUMAN_GATE_REQUIRED
          EOF
          sed -i 's/^          //' target/STATE.md
          cat > target/STATUS.json <<EOF
          {"contract":"TL-CF-MIG-01","status":"ACTIVE","sourceRepo":"$SOURCE_REPO","sourceSha":"$SOURCE_SHA","targetBranch":"$TARGET_BRANCH","stage":"BASELINE_PARITY","baselineParity":"CANDIDATE","functionalQa":"PENDING","securityAudit":"PENDING","vinextCheck":"PENDING","vinextInit":"PENDING","vinextBuild":"PENDING","engineeringQa":"PENDING","independentCritic":"PENDING","integrationReview":"PENDING","humanGate":"NOT_REACHED"}
          EOF
          cat > target/docs/contracts/TL-CF-MIG-01.md <<EOF
          # TL-CF-MIG-01 — Baseline Parity & Cloudflare Readiness
          ## Goal
          Reproduce the frozen application baseline, prove functional parity, assess security independently, then establish a non-destructive vinext/Cloudflare Workers build path without product-feature changes.
          ## Frozen source
          \`$SOURCE_REPO@$SOURCE_SHA\`
          ## Acceptance
          - frozen runtime/assets/schema/lockfile reproduced;
          - Prisma generate/deploy/seed, lint, typecheck, unit tests and Next build pass;
          - high-severity dependency findings remain an explicit blocking security gate until repaired or independently dispositioned;
          - \`vinext check\`, initialization and Workers-target build are evidenced;
          - no deploy or production cutover occurs.
          EOF
          sed -i 's/^          //' target/docs/contracts/TL-CF-MIG-01.md
          cat > target/MIGRATION.md <<'EOF'
          # Migration status
          Durable authority: `STATE.md`, `STATUS.json`, `INVARIANTS.md`, `docs/contracts/`, `docs/evidence/`.
          Historical source remains read-only. Control-plane workflow remains on `main`.
          EOF
          sed -i 's/^          //' target/MIGRATION.md

      - name: Apply DICS patch
        if: steps.command.outputs.action == 'patch64'
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          body="$(jq -r '.comment.body' "$GITHUB_EVENT_PATH")"
          printf '%s' "$(printf '%s\n' "$body" | tail -n +2 | tr -d '\r\n ')" | base64 -d > /tmp/dics.patch
          git apply --check /tmp/dics.patch
          git apply /tmp/dics.patch

      - name: Commit baseline parity candidate
        if: steps.command.outputs.action == 'baseline'
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- ':!.github/workflows'
          if ! git diff --cached --quiet; then git commit -m 'chore: refresh frozen baseline parity'; git push origin HEAD:$TARGET_BRANCH; fi

      - uses: pnpm/action-setup@v4
        with: {version: 11.15.1}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: target/pnpm-lock.yaml

      - name: Install dependencies
        shell: bash
        working-directory: target
        run: |
          if [[ "${{ steps.command.outputs.action }}" == patch64 ]]; then pnpm install --no-frozen-lockfile; else pnpm install --frozen-lockfile; fi

      - name: Functional QA
        id: functional
        shell: bash
        working-directory: target
        run: |
          set +e
          failures=0; mkdir -p docs/evidence; : > docs/evidence/functional-qa.txt
          run_step(){ name="$1"; shift; echo "===== $name =====" | tee -a docs/evidence/functional-qa.txt; "$@" 2>&1 | tee -a docs/evidence/functional-qa.txt; rc=${PIPESTATUS[0]}; echo "exit=$rc" | tee -a docs/evidence/functional-qa.txt; [[ $rc -eq 0 ]] || failures=$((failures+1)); }
          run_step prisma-generate pnpm db:generate
          run_step prisma-deploy pnpm db:deploy
          run_step prisma-seed pnpm db:seed
          run_step lint pnpm lint
          run_step typecheck pnpm typecheck
          run_step tests pnpm test
          run_step next-build pnpm build
          echo "failures=$failures" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Security audit
        id: security
        shell: bash
        working-directory: target
        run: |
          set +e
          pnpm audit --audit-level=high 2>&1 | tee docs/evidence/security-audit.txt
          rc=${PIPESTATUS[0]}; echo "rc=$rc" >> "$GITHUB_OUTPUT"; exit 0

      - name: vinext compatibility check
        if: steps.command.outputs.action == 'baseline' || steps.command.outputs.action == 'vinext'
        id: vinext_check
        shell: bash
        working-directory: target
        run: |
          set +e
          pnpm dlx vinext@$VINEXT_VERSION check 2>&1 | tee docs/evidence/vinext-check.txt
          rc=${PIPESTATUS[0]}; echo "rc=$rc" >> "$GITHUB_OUTPUT"; exit 0

      - name: Initialize Cloudflare vinext target
        if: >-
          (steps.command.outputs.action == 'baseline' || steps.command.outputs.action == 'vinext') &&
          steps.functional.outputs.failures == '0' && steps.vinext_check.outputs.rc == '0'
        id: vinext_init
        shell: bash
        working-directory: target
        env: {CI: '1'}
        run: |
          set +e
          pnpm dlx vinext@$VINEXT_VERSION init --platform=cloudflare 2>&1 | tee docs/evidence/vinext-init.txt
          rc=${PIPESTATUS[0]}; echo "rc=$rc" >> "$GITHUB_OUTPUT"; exit 0

      - name: Build Cloudflare vinext target
        if: steps.vinext_init.outputs.rc == '0'
        id: vinext_build
        shell: bash
        working-directory: target
        run: |
          set +e
          pnpm run build:vinext 2>&1 | tee docs/evidence/vinext-build.txt
          rc=${PIPESTATUS[0]}; echo "rc=$rc" >> "$GITHUB_OUTPUT"; exit 0

      - name: Engineering QA after vinext mutation
        if: steps.vinext_init.outputs.rc == '0'
        id: engineering
        shell: bash
        working-directory: target
        run: |
          set +e
          failures=0; : > docs/evidence/engineering-qa.txt
          for cmd in 'pnpm lint' 'pnpm typecheck' 'pnpm test' 'pnpm build'; do echo "===== $cmd =====" | tee -a docs/evidence/engineering-qa.txt; bash -lc "$cmd" 2>&1 | tee -a docs/evidence/engineering-qa.txt; rc=${PIPESTATUS[0]}; echo "exit=$rc" | tee -a docs/evidence/engineering-qa.txt; [[ $rc -eq 0 ]] || failures=$((failures+1)); done
          echo "failures=$failures" >> "$GITHUB_OUTPUT"; exit 0

      - name: Record DICS state and evidence
        shell: bash
        working-directory: target
        env:
          ACTION: ${{ steps.command.outputs.action }}
          FUNCTIONAL_FAILURES: ${{ steps.functional.outputs.failures }}
          SECURITY_RC: ${{ steps.security.outputs.rc }}
          CHECK_RC: ${{ steps.vinext_check.outputs.rc }}
          INIT_RC: ${{ steps.vinext_init.outputs.rc }}
          VINEXT_BUILD_RC: ${{ steps.vinext_build.outputs.rc }}
          ENGINEERING_FAILURES: ${{ steps.engineering.outputs.failures }}
        run: |
          node <<'NODE'
          const fs=require('fs'); const p='STATUS.json'; let s=fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')):{};
          const f=process.env.FUNCTIONAL_FAILURES, sec=process.env.SECURITY_RC, c=process.env.CHECK_RC, i=process.env.INIT_RC, b=process.env.VINEXT_BUILD_RC, e=process.env.ENGINEERING_FAILURES;
          s.contract='TL-CF-MIG-01'; s.status='ACTIVE';
          if(f==='0'){s.baselineParity='PASS';s.functionalQa='PASS';s.stage='VINEXT_READINESS'} else if(f){s.functionalQa='REWORK';s.stage='FUNCTIONAL_QA_REWORK'}
          if(sec) s.securityAudit=sec==='0'?'PASS':'REWORK_BLOCKING_INTEGRATION';
          if(c) s.vinextCheck=c==='0'?'PASS':'REWORK';
          if(i) s.vinextInit=i==='0'?'PASS':'REWORK';
          if(b){s.vinextBuild=b==='0'?'PASS':'REWORK';s.stage=b==='0'?'ENGINEERING_QA':'VINEXT_BUILD_REWORK'}
          if(e){s.engineeringQa=e==='0'?'PASS':'REWORK'; if(e==='0'&&b==='0')s.stage='INDEPENDENT_CRITIC'}
          s.humanGate='NOT_REACHED'; fs.writeFileSync(p,JSON.stringify(s,null,2)+'\n');
          NODE
          cat > docs/evidence/TL-CF-MIG-01-latest.md <<EOF
          # TL-CF-MIG-01 latest executable evidence
          - Action: \`${ACTION}\`
          - Candidate: \`$(git rev-parse HEAD)\`
          - Functional QA failures: \`${FUNCTIONAL_FAILURES:-not-run}\`
          - Security audit exit: \`${SECURITY_RC:-not-run}\`
          - vinext check exit: \`${CHECK_RC:-not-run}\`
          - vinext init exit: \`${INIT_RC:-not-run}\`
          - vinext build exit: \`${VINEXT_BUILD_RC:-not-run}\`
          - Engineering QA failures: \`${ENGINEERING_FAILURES:-not-run}\`
          - Source: \`$SOURCE_REPO@$SOURCE_SHA\`
          EOF
          sed -i 's/^          //' docs/evidence/TL-CF-MIG-01-latest.md

      - name: Commit passing candidate/evidence
        if: steps.functional.outputs.failures == '0'
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- ':!.github/workflows'
          if ! git diff --cached --quiet; then git commit -m 'chore: advance DICS Cloudflare migration'; git pull --rebase origin $TARGET_BRANCH; git push origin HEAD:$TARGET_BRANCH; fi
